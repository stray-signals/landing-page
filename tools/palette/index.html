<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>straysignals.dev :: palette</title>
  <meta name="description" content="Make a color palette. Lock colors you like, reroll the rest, check contrast, export or share a link.">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/tools/tools.page.css">
  <script type="module">
    try {
      const t = JSON.parse(sessionStorage.getItem('stray_theme') || 'null');
      if (t && typeof t === 'object') {
        for (const [k, v] of Object.entries(t)) document.documentElement.style.setProperty(k, v);
      }
    } catch (e) { /* no stored theme */ }
  </script>
</head>
<body>
  <header class="tools-header">
    <span><a href="/">straysignals.dev</a> <span class="dim">/ tools / palette</span></span>
    <a href="/" id="back">← back to the desktop</a>
  </header>
  <main class="tools-page-main" id="palette-root"></main>
  <script type="module">
    import { mountPaletteTool } from '/tools/palette/palette.tool.js';
    document.getElementById('back').addEventListener('click', () => {
      try { sessionStorage.setItem('stray_reopen', 'palette'); } catch (e) { /* ignore */ }
    });
    mountPaletteTool(document.getElementById('palette-root'), { mode: 'page' });
  </script>
</body>
</html>
