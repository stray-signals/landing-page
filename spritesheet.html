<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>straysignals :: expression spritesheet</title>
  <style>
    :root {
      --color-primary: #b8ffa0;
      --color-primary-dim: #b8e4a0;
      --color-bg: #0c100c;
      --color-border: #2f4f2f;
      --color-accent: #6cb03e;
      --color-accent-hi: #8fdf5a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-bg);
      color: var(--color-primary);
      font-family: monospace;
      padding: 2rem;
    }
    h1 { font-size: 1rem; margin-bottom: 2rem; opacity: 0.5; letter-spacing: 0.1em; }
    h2 { font-size: 0.8rem; margin: 2.5rem 0 1rem; opacity: 0.4; letter-spacing: 0.15em; text-transform: uppercase; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .cell canvas {
      width: 256px;
      height: 256px;
      image-rendering: pixelated;
    }
    .label {
      font-size: 0.65rem;
      opacity: 0.4;
      text-align: center;
      max-width: 256px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>straysignals.dev :: expression spritesheet</h1>
  <div id="root"></div>

  <script type="module">
    // Apply theme color from URL param before rendering
    import { hexToHsl, hslToHex } from '/shared/color.js';
    const hex = new URLSearchParams(location.search).get('color');
    if (hex && /^#[0-9a-fA-F]{6}$/.test(hex)) {
      const h = hexToHsl(hex)[0], r = document.documentElement;
      r.style.setProperty('--color-primary', hslToHex(h, 100, 81));
      r.style.setProperty('--color-primary-dim', hslToHex(h, 51, 76));
      r.style.setProperty('--color-bg', hslToHex(h, 14, 5));
      r.style.setProperty('--color-border', hslToHex(h, 25, 24));
      r.style.setProperty('--color-accent', hslToHex(h, 47, 46));
      r.style.setProperty('--color-accent-hi', hslToHex(h, 68, 61));
    }
  </script>
  <script type="module">
    import { buildExpression, buildFace, renderGrid } from './avatar/expressions/expression.builder.js';
    import { FACE_IDS } from './avatar/expressions/fullFace.js';
    import { EYE_IDS } from './avatar/expressions/eyes.js';
    import { MOUTH_IDS } from './avatar/expressions/mouths.js';

    const CELL_W = 4; // 64 cols × 4px = 256px
    const CELL_H = 8; // 32 rows × 8px = 256px
    const root = document.getElementById('root');

    function makeCanvas() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      return c;
    }

    function makeCell(label) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const canvas = makeCanvas();
      const lbl = document.createElement('div');
      lbl.className = 'label';
      lbl.textContent = label;
      cell.appendChild(canvas);
      cell.appendChild(lbl);
      return { cell, ctx: canvas.getContext('2d') };
    }

    function section(title) {
      const h = document.createElement('h2');
      h.textContent = title;
      root.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'grid';
      root.appendChild(grid);
      return grid;
    }

    // full faces
    const faceGrid = section('full faces');
    for (const id of FACE_IDS) {
      const { cell, ctx } = makeCell(id);
      renderGrid(ctx, buildFace(id), CELL_W, CELL_H);
      faceGrid.appendChild(cell);
    }

    // eye × mouth combinations
    for (const eyeID of EYE_IDS) {
      const mouthGrid = section(`eyes: ${eyeID}`);
      for (const mouthID of MOUTH_IDS) {
        const { cell, ctx } = makeCell(mouthID);
        renderGrid(ctx, buildExpression(eyeID, mouthID), CELL_W, CELL_H);
        mouthGrid.appendChild(cell);
      }
    }
  </script>
</body>
</html>
